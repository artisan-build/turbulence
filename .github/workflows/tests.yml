name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            testbench: '^10.11'
            laravel: '12'
          - php: '8.4'
            testbench: '^10.11'
            laravel: '12'
          - php: '8.5'
            testbench: '^11.1'
            laravel: '13'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Install dependencies
        env:
          TESTBENCH_VERSION: ${{ matrix.testbench }}
        run: composer require --dev "orchestra/testbench:${TESTBENCH_VERSION}" --no-update --no-interaction

      - name: Resolve dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Report Laravel version
        run: composer show laravel/framework --format=json | jq -r '"laravel/framework " + .versions[0]'

      - name: Execute tests
        run: composer ready

  coverage:
    needs: test
    runs-on: ubuntu-latest
    name: Code Coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Execute tests with coverage
        run: vendor/bin/pest --coverage --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
